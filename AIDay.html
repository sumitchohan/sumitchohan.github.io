<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- 🚫 No cache hints -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Redirecting...</title>

  <script>
    (function () {
      const url = new URL(window.location.href);
      const params = url.searchParams;

      // 🔁 If ts is missing, reload same URL with ts
      if (!params.has("ts")) {
        params.set("ts", Date.now());
        url.search = params.toString();
        window.location.replace(url.toString());
        return;
      }

      // 👉 Normal redirect logic (runs only when ts exists)
      const topic = params.get("topic");

      const routes = {
        "1": "https://ttx.sharepoint.com/:v:/s/Sumit/IQB3S2gMlTduSJ_YDx8s_dP2AcwXyT5Cnyl8Me7eTwb9g0s?e=XREBdM",
        "2": "https://ttx.sharepoint.com/:v:/s/Sumit/IQAmfsEKACRCRJEIEJbOjvXVAQJnH42ke2KNw8gtFaaiivk?e=gj3sFf",
        "3": "https://ttx.sharepoint.com/:v:/s/Sumit/IQAOk9ZfzywOS5IDnDKVYecQAUTnvHtRPAvbLiysjxblXsw?e=wrxWtf",
        "4": "https://ttx.sharepoint.com/:v:/s/Sumit/IQDUrZRqi4cVTbJtlWbvIRsVAYcOe-sGnDxhGyiBqY9EMoQ?e=9kiaLl",
        "5": "https://ttx.sharepoint.com/:v:/s/Sumit/IQCubl0PcA1nSJgQkKZPgxZYATMkkPP6kpFmIJMe-21pvUk?e=JY11xn"
      };

      if (routes[topic]) {
        window.location.replace(routes[topic]);
      } else {
        document.addEventListener("DOMContentLoaded", () => {
          document.body.innerHTML = `
            <h2>Invalid redirect</h2>
            <p>Please provide a valid <code>topic</code> parameter.</p>
            <p>Example: <code>?topic=1</code></p>
          `;
        });
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
