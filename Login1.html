<!DOCTYPE html>
<html>
<head>
    <title>PKCE Auth - Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.4;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0078d4 0%, #106ebe 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 5px;
        }

        .content {
            padding: 25px;
        }

        .result-section {
            margin-bottom: 20px;
        }

        .result-section h3 {
            color: #495057;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .result-section h3::before {
            content: '';
            width: 3px;
            height: 16px;
            background: #0078d4;
            margin-right: 10px;
            border-radius: 2px;
        }

        .user-info-box {
            background: #e8f5e9;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #4caf50;
        }

        .user-info-content {
            font-family: 'Segoe UI', sans-serif;
            line-height: 1.8;
        }

        .user-info-content > div {
            margin-bottom: 10px;
        }

        .user-info-content strong {
            color: #2e7d32;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0078d4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            
            .content {
                padding: 15px;
            }
            
            .header {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Entra ID PKCE Authorization</h1>
    </div>
    
    <div class="content">
        <div class="loading" id="loadingSection">
            <div class="spinner"></div>
            <p>Authenticating...</p>
        </div>

        <div class="result-section" id="userInfoSection" style="display: none;">
            <h3>Logged In User</h3>
            <div class="user-info-box">
                <div id="userInfo" class="user-info-content"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Configuration - update these values to match your Azure AD app
    const CONFIG = {
        tenantId: "28949bdf-26fd-49e6-8d21-db9098219629",
        clientId: "a5e0d265-7dc6-4bfc-9611-3a1668fc1fd7",
        scope: "529508af-671d-4d3b-9efd-b915a7d8a983/.default"
    };

    let codeVerifier = "";

    function generateCodeVerifier() {
        const array = new Uint8Array(32);
        window.crypto.getRandomValues(array);
        return btoa(String.fromCharCode(...array))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function generateCodeChallenge(verifier) {
        const data = new TextEncoder().encode(verifier);
        const digest = await window.crypto.subtle.digest("SHA-256", data);
        return btoa(String.fromCharCode(...new Uint8Array(digest)))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function decodeJWT(token) {
        try {
            const parts = token.split('.');
            if (parts.length !== 3) {
                return { error: 'Invalid JWT format' };
            }

            const header = JSON.parse(atob(parts[0].replace(/-/g, '+').replace(/_/g, '/')));
            const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
            
            return {
                header: header,
                payload: payload,
                signature: parts[2]
            };
        } catch (error) {
            return { error: 'Failed to decode JWT: ' + error.message };
        }
    }

    async function startAuth() {
        codeVerifier = generateCodeVerifier();
        const codeChallenge = await generateCodeChallenge(codeVerifier);

        // Store the code verifier in localStorage to persist across redirects
        localStorage.setItem('pkce_code_verifier', codeVerifier);

        // Redirect URI must not include query parameters for Azure AD
        const redirectUri = window.location.origin + window.location.pathname;

        const authUrl = `https://login.microsoftonline.com/${CONFIG.tenantId}/oauth2/v2.0/authorize?` +
            `client_id=${encodeURIComponent(CONFIG.clientId)}` +
            `&response_type=code` +
            `&redirect_uri=${encodeURIComponent(redirectUri)}` +
            `&response_mode=query` +
            `&scope=${encodeURIComponent(CONFIG.scope)}` +
            `&code_challenge=${encodeURIComponent(codeChallenge)}` +
            `&code_challenge_method=S256`;

        window.location = authUrl;
    }

    async function exchangeCode(code) {
        // Retrieve the code verifier from localStorage
        const storedCodeVerifier = localStorage.getItem('pkce_code_verifier');
        if (!storedCodeVerifier) {
            document.getElementById('loadingSection').innerHTML = 
                '<p style="color: #d32f2f;">Authentication failed. Please refresh the page to try again.</p>';
            return;
        }

        // Redirect URI must not include query parameters for Azure AD
        const redirectUri = window.location.origin + window.location.pathname;

        // Call Entra ID directly (requires SPA app registration)
        const params = new URLSearchParams();
        params.append("grant_type", "authorization_code");
        params.append("client_id", CONFIG.clientId);
        params.append("scope", CONFIG.scope);
        params.append("code", code);
        params.append("redirect_uri", redirectUri);
        params.append("code_verifier", storedCodeVerifier);

        const tokenUrl = `https://login.microsoftonline.com/${CONFIG.tenantId}/oauth2/v2.0/token`;

        try {
            const resp = await fetch(tokenUrl, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: params
            });

            const data = await resp.json();
            
            // Decode and display the access token if present
            if (data.access_token) {
                const decodedToken = decodeJWT(data.access_token);
                displayUserInfo(decodedToken);
            } else if (data.error) {
                document.getElementById('loadingSection').innerHTML = 
                    `<p style="color: #d32f2f;">Authentication failed: ${data.error_description || data.error}</p>`;
            }
        } catch (error) {
            document.getElementById('loadingSection').innerHTML = 
                `<p style="color: #d32f2f;">Network error: ${error.message}</p>`;
        } finally {
            // Clear the stored code verifier after use
            localStorage.removeItem('pkce_code_verifier');
        }
    }

    function displayUserInfo(decodedToken) {
        if (!decodedToken || !decodedToken.payload) {
            document.getElementById('loadingSection').innerHTML = 
                '<p style="color: #d32f2f;">Failed to decode token.</p>';
            return;
        }

        const payload = decodedToken.payload;
        const userInfoSection = document.getElementById('userInfoSection');
        const userInfo = document.getElementById('userInfo');
        const loadingSection = document.getElementById('loadingSection');
        
        let html = '';
        
        if (payload.name) {
            html += `<div><strong>Name:</strong> ${payload.name}</div>`;
        }
        if (payload.unique_name || payload.upn || payload.preferred_username) {
            const email = payload.unique_name || payload.upn || payload.preferred_username;
            html += `<div><strong>Email:</strong> ${email}</div>`;
        }
        if (payload.sub) {
            html += `<div><strong>Subject:</strong> ${payload.sub}</div>`;
        }
        if (payload.oid) {
            html += `<div><strong>Object ID:</strong> ${payload.oid}</div>`;
        }
        if (payload.tid) {
            html += `<div><strong>Tenant ID:</strong> ${payload.tid}</div>`;
        }
        if (payload.roles && payload.roles.length > 0) {
            html += `<div><strong>Roles:</strong> ${payload.roles.join(', ')}</div>`;
        }
        
        userInfo.innerHTML = html;
        loadingSection.style.display = 'none';
        userInfoSection.style.display = 'block';
    }

    // Main flow
    window.onload = async function() {
        const params = new URLSearchParams(window.location.search);
        
        if (params.has("code")) {
            // Authorization code received from redirect - exchange it for token
            const code = params.get("code");
            window.history.replaceState({}, document.title, window.location.pathname);
            await exchangeCode(code);
        } else {
            // No code - start the authorization flow
            await startAuth();
        }
    }
</script>
</body>
</html>
